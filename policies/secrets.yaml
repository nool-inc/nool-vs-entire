# Secret-leak gate (Aram DSL). Judged when a change is proposed, sealed and
# pushed, and before a `nool code` agent's edit runs.
- inv_id: SEC-1
  title: no known-format credentials in a change
  scope: { type: global }
  kind: structural
  severity: critical
  mode: blocking
  stages: [pre-tool, pre-propose, pre-solidify, pre-push]
  forbids:
    - diff_matches: "-----BEGIN [A-Z ]*PRIVATE KEY-----"
    - diff_matches: "\\bAKIA[0-9A-Z]{16}\\b"
    - diff_matches: "\\bgh[pousr]_[A-Za-z0-9]{36,}\\b"
    - diff_matches: "\\bsk-ant-[A-Za-z0-9_-]{20,}"
    - diff_matches: "NOOL_IDENTITY_KEY\\s*=\\s*['\"]?[0-9a-fA-F]{64}"
- inv_id: SEC-2
  title: high-entropy token in a change (review it)
  scope: { type: global }
  kind: structural
  severity: medium
  mode: warning
  stages: [pre-propose, pre-solidify]
  forbids:
    - diff_has_high_entropy_secret: true
      min_len: 32
      min_bits_per_char: 4.5
