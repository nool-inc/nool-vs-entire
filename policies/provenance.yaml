# Entire provenance gate (Aram DSL, evidence-based). Source, test and
# benchmark changes may be published only once a trusted checker has attested
# that the landed commit links an existing Entire checkpoint whose recorded
# files overlap the change. Record it with scripts/attest_entire_checkpoint.py.
# A missing attestation holds the push (exit 3, EVIDENCE_PENDING); a failed
# one blocks it.
- inv_id: ENTIRE-1
  title: published code links a verified Entire checkpoint
  scope: { type: global }
  kind: behavioral
  severity: high
  mode: blocking
  stages: [pre-push, doctor]
  when:
    semantic_path_matches: "^(src|tests|benchmark|scripts)/"
  requires:
    - evidence_has_attestation:
        assertion: entire-checkpoint
        verdict: pass
        trusted: true
